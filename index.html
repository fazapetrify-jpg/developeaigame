<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musti Musik Kurikulum</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1117;
    color: #f2f2f2;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap { max-width: 640px; width: 100%; text-align: center; }
  h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
  p.sub { color: #a0a0a8; margin-bottom: 2rem; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }
  a.card {
    display: block;
    padding: 24px;
    border-radius: 16px;
    background: #1b1e29;
    border: 1px solid #2a2d3a;
    text-decoration: none;
    color: inherit;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  a.card:hover { transform: translateY(-2px); border-color: #6c5ce7; }
  a.card .emoji { font-size: 2rem; display: block; margin-bottom: 8px; }
  a.card .title { font-weight: 600; font-size: 1.1rem; }
  a.card .desc { color: #a0a0a8; font-size: 0.9rem; margin-top: 4px; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Musti Musik — Kurikulum</h1>
    <p class="sub">Pilih game untuk mulai latihan telinga musikmu.</p>
    <div class="grid">
      <a class="card" href="tebaknada/">
        <span class="emoji">🎧</span>
        <span class="title">Tebak Nada</span>
        <span class="desc">Kuis pendengaran interaktif — 4 mode + Bedah Lagu</span>
      </a>
      <a class="card" href="jarinada/">
        <span class="emoji">🎹</span>
        <span class="title">Jari Nada</span>
        <span class="desc">Latihan jari & nada</span>
      </a>
    </div>
  </div>
</body>
</html>
